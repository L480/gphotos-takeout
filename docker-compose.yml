services:
  gphotos-takeout:
    container_name: gphotos-takeout
    hostname: gphotos-takeout
    image: ghcr.io/l480/gphotos-takeout:latest
    user: "1000:1000"
    restart: unless-stopped
    environment:
      RCLONE_DRIVE_REMOTE: gdrive:Takeout
      RCLONE_S3_REMOTE: s3:my-bucket
      RCLONE_TRANSFERS: "2"
      RCLONE_CHECKERS: "2"
      RCLONE_LOG_LEVEL: INFO
      # Verify every upload by checksum before the source is deleted from Drive.
      # Use "download" to re-read and hash both sides (costs egress), or "size"
      # only for S3 providers that drop user metadata on multipart uploads.
      # Run scripts/preflight-check.sh once before enabling this against a new
      # bucket: on a provider that drops multipart metadata, rclone reports
      # unhashable files as matches and "checksum" would verify nothing.
      VERIFY_MODE: checksum
      DELETE_AFTER_VERIFY: "true"
      WRITE_MANIFEST: "true"
    volumes:
      - /opt/gphotos-takeout:/config/rclone
